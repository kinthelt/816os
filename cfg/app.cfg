# ld65 config for a process image. The kernel copies the image to $0000 in
# the process's bank and starts it at its first byte. ZEROPAGE is the
# process's own direct page, wherever the kernel puts it.
#
# BSS is not part of the image and is not cleared; initialize it yourself.
MEMORY {
    ZP:  start = $0000, size = $0100, type = rw;
    RAM: start = $0000, size = $E000, type = rw, file = %O;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw;
    BSS:      load = RAM, type = bss;
}
