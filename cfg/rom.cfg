# ld65 config for the 32 KB ROM at $8000-$FFFF, plus kernel RAM in bank 0.
MEMORY {
    ZP:    start = $0000, size = $0100, type = rw;   # kernel direct page
    KVARS: start = $0100, size = $0100, type = rw;   # kernel variables, process table
    ROM:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    ZEROPAGE:  load = ZP,    type = zp;
    BSS:       load = KVARS, type = bss;
    CODE:      load = ROM,   type = ro;
    RODATA:    load = ROM,   type = ro;
    APPS:      load = ROM,   type = ro;
    JUMPTABLE: load = ROM,   type = ro, start = $FFB0;
    VECTORS:   load = ROM,   type = ro, start = $FFE0;
}
